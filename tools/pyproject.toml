[project]
name = "stechec2"
version = "2.0.0"
description = "stehec2 python tooling"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.5",
    "pyyaml>=6.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["generator/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
stechec2-generator = "generator.__main__:main"
